[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "split-cloth-v2"
version = "0.1.0"
description = "Measured-joint reverse-suffix fold-cloth segmentation"
requires-python = ">=3.11"
dependencies = [
  "numpy==2.5.4",
  "scipy==1.18.1",
  "av==19.0.2",
  "Pillow==13.0.0",
  "PyYAML==6.0.3",
]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[project.scripts]
split-cloth-v2 = "split_cloth_v2.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
split_cloth_v2 = ["joint/*.cpp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
